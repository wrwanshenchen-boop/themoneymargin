<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="120" cy="120" r="110" />
    </clipPath>
  </defs>

  <!-- Outer Ring and Background -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="#E8E2D9" stroke-width="4" />
  <circle cx="120" cy="120" r="110" fill="#F3EFEA" />

  <!-- Subtle warm accent geometric background circle -->
  <circle cx="180" cy="70" r="28" fill="#E67E22" opacity="0.14" />

  <g clip-path="url(#circleClip)">
    <!-- Shoulders / Torso / Oxford Shirt -->
    <path d="M42 225 L54 184 C58 170, 72 162, 90 159 L120 167 L150 159 C168 162, 182 170, 186 184 L198 225 Z" 
          fill="#FAF8F5" stroke="#1A2B3C" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Warm Orange Inner Collar Accent -->
    <path d="M106 163 L120 184 L134 163 Z" fill="#E67E22" />

    <!-- Shirt Collar (Clean button-down line art) -->
    <path d="M96 160 L112 188 L120 178 L128 188 L144 160" 
          fill="none" stroke="#1A2B3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="120" y1="188" x2="120" y2="225" stroke="#1A2B3C" stroke-width="2.5" stroke-dasharray="4 3" />

    <!-- Neck -->
    <path d="M104 135 L104 164 C110 168, 130 168, 136 164 L136 135 Z" 
          fill="#F7F3EE" stroke="#1A2B3C" stroke-width="3" stroke-linejoin="round" />
    <!-- Neck Shadow -->
    <path d="M105 137 C112 144, 128 144, 135 137 L135 146 C126 150, 114 150, 105 146 Z" fill="#E8E2D9" />

    <!-- Ears -->
    <!-- Left Ear (Three-quarter view perspective) -->
    <path d="M78 108 C75 104, 76 96, 82 96 L85 101" fill="#F7F3EE" stroke="#1A2B3C" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right Ear -->
    <path d="M149 100 C157 100, 161 107, 159 116 C157 124, 151 126, 146 122" 
          fill="#F7F3EE" stroke="#1A2B3C" stroke-width="3" stroke-linecap="round" />
    <path d="M153 107 C155 110, 154 115, 150 116" fill="none" stroke="#1A2B3C" stroke-width="2" stroke-linecap="round" />

    <!-- Head / Face Outline (Three-quarter profile) -->
    <path d="M86 92 C86 70, 98 62, 120 62 C142 62, 151 72, 151 96 C151 114, 148 126, 142 135 C134 146, 124 148, 116 148 C102 148, 92 138, 88 125 C86 117, 86 104, 86 92 Z" 
          fill="#F7F3EE" stroke="#1A2B3C" stroke-width="3" stroke-linejoin="round" />

    <!-- Hair (Clean contemporary styling, short side sweep) -->
    <path d="M83 91 C81 74, 89 54, 110 50 C128 47, 149 53, 153 69 C156 79, 155 87, 151 92 C148 84, 144 78, 137 74 C129 69, 117 70, 107 75 C98 79, 91 85, 87 91 Z" 
          fill="#1A2B3C" stroke="#1A2B3C" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Side Hairline Details -->
    <path d="M84 92 L86 106 C88 107, 91 106, 92 101 L91 93" fill="#1A2B3C" />
    <path d="M149 92 L147 101 C146 104, 148 106, 150 105 L151 92" fill="#1A2B3C" />

    <!-- Eyebrows (Calm, relaxed expression) -->
    <path d="M96 95 C101 93, 108 94, 113 96" fill="none" stroke="#1A2B3C" stroke-width="2.6" stroke-linecap="round" />
    <path d="M125 95 C130 93, 138 94, 142 96" fill="none" stroke="#1A2B3C" stroke-width="2.6" stroke-linecap="round" />

    <!-- Glasses (Distinctive rectangular rounded frame with subtle transparency) -->
    <!-- Left Rim -->
    <rect x="94" y="99" width="20" height="17" rx="5" 
          fill="#FAF8F5" fill-opacity="0.65" stroke="#1A2B3C" stroke-width="2.8" />
    <!-- Right Rim -->
    <rect x="124" y="99" width="20" height="17" rx="5" 
          fill="#FAF8F5" fill-opacity="0.65" stroke="#1A2B3C" stroke-width="2.8" />
    <!-- Bridge -->
    <path d="M114 105 C117 103, 121 103, 124 105" fill="none" stroke="#1A2B3C" stroke-width="2.8" stroke-linecap="round" />
    <!-- Arms / Temples -->
    <line x1="94" y1="104" x2="84" y2="102" stroke="#1A2B3C" stroke-width="2.5" stroke-linecap="round" />
    <line x1="144" y1="104" x2="152" y2="102" stroke="#1A2B3C" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (Approachable, neutral-warm gaze) -->
    <circle cx="104" cy="107" r="2.2" fill="#1A2B3C" />
    <circle cx="134" cy="107" r="2.2" fill="#1A2B3C" />

    <!-- Nose (Minimalist contour) -->
    <path d="M119 104 L119 119 L123 121" fill="none" stroke="#1A2B3C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mouth (Neutral, gentle curve) -->
    <path d="M112 133 C117 135, 123 135, 127 133" fill="none" stroke="#1A2B3C" stroke-width="2.4" stroke-linecap="round" />
  </g>
</svg>
